name: Publish to npm

# Provenance: GitHub OIDC mints an id-token, npm signs the package with a
# sigstore attestation linking it to this repository, commit and workflow.
# NPM_TOKEN is used only for registry authentication.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # npm >= 11 is needed for OIDC/provenance support on some runners.
      - name: Upgrade npm
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Smoke (tool list)
        run: npm run smoke
      # Trusted Publisher (OIDC): no NPM_TOKEN. The package must have a
      # trusted relationship to this repo/workflow on npmjs.com, which is set
      # once by the account owner with 2FA:  npm trust github aotrust-mcp
      #   --file publish.yml --repo GitSerge-crypto/aotrust-mcp --allow-publish -y
      - name: Publish with provenance
        run: npm publish --provenance --access public
